services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cardiolens
      POSTGRES_USER: cardiolens
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cardiolens"]
      interval: 5s
      retries: 10
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      CARDIOLENS_DB: postgresql+psycopg://cardiolens:${POSTGRES_PASSWORD}@db:5432/cardiolens
      CARDIOLENS_SECRET: ${CARDIOLENS_SECRET:?set CARDIOLENS_SECRET}
      CARDIOLENS_ADMIN_EMAIL: ${CARDIOLENS_ADMIN_EMAIL:?set CARDIOLENS_ADMIN_EMAIL}
      CARDIOLENS_ADMIN_PASSWORD: ${CARDIOLENS_ADMIN_PASSWORD:?set CARDIOLENS_ADMIN_PASSWORD}
      CARDIOLENS_CLINIC: ${CARDIOLENS_CLINIC:-main}
    ports:
      - "7860:7860"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:7860/api/health')"]
      interval: 15s
      retries: 5
volumes:
  dbdata:
